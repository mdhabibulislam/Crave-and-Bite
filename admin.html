<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Admin — Crave & Bite</title>
<style>
:root{--y:#ffc72c;--r:#dc2127;--k:#161616;--cream:#fff6dc;box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#f3ecd6;color:var(--k);font:500 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h2,h3{margin:0 0 10px}[hidden]{display:none!important}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:2px solid var(--k);background:var(--r);color:#fff;font:700 1rem inherit;cursor:pointer}.btn.alt{background:#fff;color:var(--k)}.btn.sm{min-height:36px;padding:0 10px;font-size:.85rem}.btn.del{background:#fff;color:#b00010;border-color:#b00010}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:2px solid var(--k);border-radius:10px;background:#fff;font:inherit}
label{display:block;font-weight:700;margin:10px 0 0}label.chk{display:flex;gap:8px;align-items:center}label.chk input{width:22px;min-height:22px}
:focus-visible{outline:3px solid #0b5fff;outline-offset:2px}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.panel{background:var(--cream);border:3px solid var(--k);border-radius:16px;box-shadow:5px 5px 0 var(--k);padding:20px;width:min(420px,100%)}
.top{background:var(--k);color:var(--y);display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:4px solid var(--r)}
.shell{display:grid;grid-template-columns:1fr;max-width:1100px;margin:0 auto}
nav#nav{display:flex;overflow-x:auto;gap:6px;padding:10px 12px;background:#fff;border-bottom:2px solid var(--k)}nav#nav button{flex:none;min-height:44px;padding:0 14px;border:2px solid var(--k);border-radius:10px;background:#fff;font-weight:700;cursor:pointer}nav#nav button[aria-current=true]{background:var(--y)}
@media(min-width:800px){.shell{grid-template-columns:210px 1fr;align-items:start}nav#nav{flex-direction:column;border:0;border-right:2px solid var(--k);min-height:calc(100vh - 60px);position:sticky;top:0}}
#view{padding:16px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.bar h2{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:#fff;border:2px solid var(--k);border-radius:12px;padding:14px;font-weight:600}.stat b{display:block;font-size:2rem;color:var(--r)}
.list{display:grid;gap:10px}.row{background:#fff;border:2px solid var(--k);border-radius:12px;padding:10px;display:grid;grid-template-columns:64px 1fr;gap:10px}
.row img,.ph{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#ddd;display:grid;place-items:center}
.row .tg{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}.row .tg label{display:flex;gap:6px;align-items:center;margin:0;font-weight:600;font-size:.9rem}.row .tg input{width:20px;min-height:20px}
.row .ac{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.note{font-size:.85rem;color:#444}.err{color:#b00010;font-weight:700;min-height:1.2em}
dialog{border:3px solid var(--k);border-radius:16px;padding:18px;width:min(560px,94vw);max-height:92vh;background:var(--cream)}dialog::backdrop{background:rgba(0,0,0,.6)}
.imgf{display:flex;gap:12px;align-items:center;margin-top:10px}.imgf img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:2px solid var(--k)}.imgf>div{display:grid;gap:6px}
.pv{border:3px solid var(--k);border-radius:16px;background:#ffc72c;padding:12px;display:grid;gap:8px;text-align:center;margin-top:10px}.pv img{width:100%;max-height:220px;object-fit:contain;border-radius:10px}.pvi{background:var(--cream);border:2px solid var(--k);border-radius:12px;padding:8px}.pvi h3,.pvi p{margin:0 0 4px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.75rem;font-weight:800;border:2px solid var(--k);background:#fff}.badge.on{background:#9be59b}.badge.off{background:#ffb3b3}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--k);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:999;max-width:90vw}#toast.show{opacity:1}#toast.bad{background:#b00010}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.grid2 div{background:#fff;border:2px solid var(--k);border-radius:10px;padding:6px;font-size:.75rem;word-break:break-all}.grid2 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
</style></head><body>
<main id="login" class="center" hidden><form class="panel" id="lf" autocomplete="on"><h2>Owner login</h2>
<label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<p class="err" id="lerr" role="alert"></p><button class="btn" style="width:100%">Sign in</button>
<p><button class="btn alt sm" type="button" id="forgot">Forgot password?</button> <a href="/" style="margin-left:8px">Back to website</a></p></form></main>
<main id="reset" class="center" hidden><form class="panel" id="rf"><h2>Set a new password</h2><label for="np">New password (10+ characters)</label><input id="np" type="password" autocomplete="new-password" minlength="10" required><p class="err" id="rerr" role="alert"></p><button class="btn" style="width:100%">Update password</button></form></main>
<div id="app" hidden><header class="top"><b>Crave & Bite · Admin</b><span><a href="/" style="color:var(--y);margin-right:12px">View site</a><button class="btn alt sm" id="logout">Log out</button></span></header>
<div class="shell"><nav id="nav" aria-label="Admin"><button data-v="overview">Overview</button><button data-v="menu">Menu</button><button data-v="offers">Offers &amp; Promotions</button><button data-v="combos">Combos</button><button data-v="popup">Popup Manager</button><button data-v="library">Image Library</button><button data-v="settings">Website Settings</button></nav><section id="view" aria-live="polite"></section></div></div>
<dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB="https://qadsahrzlndzccvcxffg.supabase.co",KEY="sb_publishable_SYxEmpi_pPtHNWYf-BVU3Q_i-ulMH1Z"; // public values; all writes are blocked by Row Level Security unless signed in as an admin
const sb=supabase.createClient(SB,KEY,{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show=id=>["login","reset","app"].forEach(x=>$("#"+x).hidden=x!==id);
function toast(t,bad){const e=$("#toast");e.textContent=t;e.className=bad?"bad show":"show";clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",4500)}
const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
const run=async f=>{try{await f()}catch(e){toast(e.message||String(e),1)}};
let view="overview",D={},idleOn=false,idle;
// ---------- auth ----------
$("#lf").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";const{data,error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});$("#pw").value="";if(error){$("#lerr").textContent="Sign-in failed. Check your email and password.";return}await enter(data.session)};
async function enter(s){const{data}=await sb.from("admins").select("user_id").eq("user_id",s.user.id).maybeSingle();if(!data){await sb.auth.signOut();show("login");$("#lerr").textContent="This account is not authorised for the admin panel.";return}show("app");startIdle();go(view)}
$("#forgot").onclick=async()=>{const em=$("#em").value.trim();if(!em){$("#lerr").textContent="Enter your email first.";return}const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+"/admin"});$("#lerr").textContent=error?"Couldn't send the reset email. Try again later.":"If this email belongs to an admin, a reset link has been sent."};
sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")show("reset")});
$("#rf").onsubmit=async e=>{e.preventDefault();const p=$("#np").value;if(p.length<10){$("#rerr").textContent="Use at least 10 characters.";return}const{error}=await sb.auth.updateUser({password:p});if(error){$("#rerr").textContent=error.message;return}toast("Password updated");history.replaceState(null,"","/admin");const{data:{session}}=await sb.auth.getSession();session?enter(session):show("login")};
async function logout(){await sb.auth.signOut();show("login")}
$("#logout").onclick=logout;
function startIdle(){const r=()=>{clearTimeout(idle);idle=setTimeout(async()=>{await logout();$("#lerr").textContent="Signed out after 30 minutes of inactivity."},18e5)};if(!idleOn){idleOn=true;["click","keydown","touchstart"].forEach(ev=>addEventListener(ev,r))}r()}
(async()=>{if(location.hash.includes("type=recovery")){show("reset");return}const{data:{session}}=await sb.auth.getSession();session?enter(session):show("login")})();
// ---------- helpers ----------
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
async function go(v){view=v;document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v));$("#view").innerHTML="Loading…";try{await V[v]()}catch(e){$("#view").innerHTML=`<p class="err">${esc(e.message||e)}</p>`}}
const live=o=>{const n=Date.now();return o.published&&o.active&&(!o.start_at||Date.parse(o.start_at)<=n)&&(!o.end_at||Date.parse(o.end_at)>=n)};
const fd=t=>new Date(t).toLocaleString("en-GB",{timeZone:"Asia/Dhaka",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const toLocal=t=>t?new Date(Date.parse(t)+6*36e5).toISOString().slice(0,16):"";   // Bangladesh time (UTC+6)
const fromLocal=v=>v?new Date(v+":00+06:00").toISOString():null;
const dtext=o=>o.discount_type==="percentage"?`${o.discount_value}% off`:o.discount_type==="fixed"?`৳${o.discount_value} off`:"";
const pv=(o,img)=>`<div class="pv">${img?`<img src="${esc(img)}" alt="">`:""}<div class="pvi"><h3>${esc(o.title||"Title")}</h3>${o.description?`<p>${esc(o.description)}</p>`:""}<p class="note">${esc([dtext(o),o.promo_code?"Use code "+o.promo_code:"",o.end_at?"Valid until "+fd(o.end_at):""].filter(Boolean).join(" · "))}</p></div><button class="btn" type="button" tabindex="-1">${esc(o.cta_text||"Order Now")}</button></div>`;
function dlg(html){const d=$("#dlg");d.innerHTML=html;d.showModal();const c=d.querySelector("#cx");if(c)c.onclick=()=>d.close();return d}
// images: validate, resize to <=1000px, convert to WebP, upload to private-write/public-read bucket
async function prep(file){const bmp=await createImageBitmap(file);const s=Math.min(1,1000/bmp.width);const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/webp",.82))}
async function upload(file,folder){const blob=await prep(file);const path=`${folder}/${crypto.randomUUID()}.webp`;const{error}=await sb.storage.from("media").upload(path,blob,{contentType:"image/webp",cacheControl:"31536000"});if(error)throw error;return sb.storage.from("media").getPublicUrl(path).data.publicUrl}
const objPath=u=>u&&u.includes("/storage/v1/object/public/media/")?u.split("/storage/v1/object/public/media/")[1]:null;
async function rm(u){const p=objPath(u);if(p)await sb.storage.from("media").remove([p])}
function imgField(url){let cur=url||null,file=null;const id="i"+Math.random().toString(36).slice(2,7);
 const html=`<div class="imgf"><img id="${id}p" alt="Image preview" ${cur?`src="${esc(cur)}"`:"hidden"}><div><input type="file" id="${id}f" accept="image/jpeg,image/png,image/webp" aria-label="Choose image"><button type="button" class="btn alt sm" id="${id}r">Remove image</button><span class="note">JPG, PNG or WebP, up to 8 MB</span></div></div>`;
 const bind=()=>{const p=$("#"+id+"p"),f=$("#"+id+"f");f.onchange=e=>{const x=e.target.files[0];if(!x)return;if(!/^image\/(jpeg|png|webp)$/.test(x.type)){toast("Only JPG, PNG or WebP images.",1);f.value="";return}if(x.size>8e6){toast("Image must be under 8 MB.",1);f.value="";return}file=x;p.src=URL.createObjectURL(x);p.hidden=false};$("#"+id+"r").onclick=()=>{file=null;cur=null;p.hidden=true;p.removeAttribute("src");f.value=""}};
 const save=async folder=>{if(file){const u=await upload(file,folder);if(url)await rm(url);return u}if(!cur&&url){await rm(url);return null}return cur};
 const preview=()=>{const p=$("#"+id+"p");return p.hidden?null:p.src};
 return{html,bind,save,preview}}
const badge=(on,a,b)=>`<span class="badge ${on?"on":"off"}">${on?a:b}</span>`;
const V={};
$("#view").onclick=e=>{const b=e.target.closest("[data-a]");if(b)run(()=>A[b.dataset.a](b.dataset.id))};
$("#view").onchange=e=>{const el=e.target;if(el.id==="mf"){window._mf=el.value;go("menu");return}const t=el.dataset.t;if(!t)return;const[tb,id,f]=t.split(":");run(async()=>{try{await q(sb.from(tb).update({[f]:el.checked}).eq("id",id));toast("Saved — live on the website")}catch(x){el.checked=!el.checked;throw x}})};
const A={};
// ---------- overview ----------
V.overview=async()=>{const[it,of,cb]=await Promise.all([q(sb.from("menu_items").select("id,available")),q(sb.from("offers").select("id,active,published,start_at,end_at")),q(sb.from("combos").select("id,active"))]);
 $("#view").innerHTML=`<h2>Overview</h2><div class="cards">${[["Menu items",it.length],["Available items",it.filter(i=>i.available).length],["Active offers (live now)",of.filter(live).length],["Published offers",of.filter(o=>o.published).length],["Active combos",cb.filter(c=>c.active).length]].map(([a,b])=>`<div class="stat"><b>${b}</b>${a}</div>`).join("")}</div><p class="note">Changes are live on the public website immediately. No redeploy needed.</p>`};
// ---------- menu ----------
V.menu=async()=>{D.cats=await q(sb.from("categories").select("*").order("sort"));D.items=await q(sb.from("menu_items").select("*").order("sort"));const f=window._mf||"all",cn=id=>(D.cats.find(c=>c.id===id)||{}).name;
 $("#view").innerHTML=`<div class="bar"><h2>Menu</h2><button class="btn" data-a="newItem">+ Add item</button></div><div class="bar"><select id="mf" aria-label="Filter by category" style="max-width:260px"><option value="all">All categories</option>${D.cats.map(c=>`<option value="${c.id}"${String(f)===String(c.id)?" selected":""}>${esc(c.name)}</option>`).join("")}</select><button class="btn alt" data-a="cats">Manage categories</button></div>
 <div class="list">${D.items.filter(i=>f==="all"||String(i.category_id)===String(f)).map(i=>`<div class="row">${i.image_url?`<img src="${esc(i.image_url)}" alt="">`:`<div class="ph">🍽</div>`}<div><b>${esc(i.name)}</b> ${i.spicy?"🌶":""}<div class="note">${esc(cn(i.category_id))} · ${i.prices.map(p=>"৳"+p).join(" / ")}</div><div class="tg"><label><input type="checkbox" data-t="menu_items:${i.id}:available"${i.available?" checked":""}>Available</label><label><input type="checkbox" data-t="menu_items:${i.id}:featured"${i.featured?" checked":""}>Featured</label><label><input type="checkbox" data-t="menu_items:${i.id}:published"${i.published?" checked":""}>Published</label></div></div><div class="ac"><button class="btn alt sm" data-a="editItem" data-id="${i.id}">Edit</button><button class="btn del sm" data-a="delItem" data-id="${i.id}">Delete</button></div></div>`).join("")||"<p>No items.</p>"}</div>`};
A.newItem=()=>itemForm({});A.editItem=id=>itemForm(D.items.find(i=>i.id===id));
function itemForm(i){const im=imgField(i.image_url),ck=(n,v)=>`<label class="chk"><input type="checkbox" name="${n}"${v?" checked":""}> ${({spicy:"Spicy (Naga)",available:"Available to order",featured:"Featured on homepage",published:"Published (visible on website)"})[n]}</label>`;
 const d=dlg(`<form id="f"><h3>${i.id?"Edit":"Add"} menu item</h3><label>Name<input name="name" required maxlength="80" value="${esc(i.name||"")}"></label><label>Category<select name="category_id">${D.cats.map(c=>`<option value="${c.id}"${c.id===i.category_id?" selected":""}>${esc(c.name)}</option>`).join("")}</select></label><label>Description (optional)<textarea name="description" maxlength="300" rows="2">${esc(i.description||"")}</textarea></label><label>Price(s) in ৳ — one price, or up to four separated by commas (e.g. 70, 140)<input name="prices" required inputmode="numeric" value="${esc((i.prices||[]).join(", "))}"></label>${ck("spicy",i.spicy)}${ck("available",i.id?i.available:true)}${ck("featured",i.featured)}${ck("published",i.id?i.published:true)}${im.html}<p class="err" id="ferr" role="alert"></p><div class="bar"><button class="btn alt" type="button" id="cx">Cancel</button><button class="btn">Save &amp; publish</button></div></form>`);im.bind();
 d.querySelector("#f").onsubmit=ev=>{ev.preventDefault();run(async()=>{const f=new FormData(ev.target),prices=String(f.get("prices")).split(",").map(x=>x.trim()).filter(Boolean).map(Number),name=String(f.get("name")).trim();
  if(!name){$("#ferr").textContent="Name is required.";return}if(!prices.length||prices.length>4||prices.some(p=>!Number.isInteger(p)||p<1||p>99999)){$("#ferr").textContent="Enter 1–4 whole-number prices, e.g. 70, 140.";return}
  const row={name,category_id:+f.get("category_id"),description:String(f.get("description")||"").trim()||null,prices,spicy:!!f.get("spicy"),available:!!f.get("available"),featured:!!f.get("featured"),published:!!f.get("published"),image_url:await im.save("items"),updated_at:new Date().toISOString()};
  i.id?await q(sb.from("menu_items").update(row).eq("id",i.id)):await q(sb.from("menu_items").insert({...row,sort:999}));d.close();toast("Saved — live on the website");go("menu")})}}
A.delItem=async id=>{const i=D.items.find(x=>x.id===id);if(!confirm(`Delete "${i.name}"? This cannot be undone.`))return;await rm(i.image_url);await q(sb.from("menu_items").delete().eq("id",id));toast("Item deleted");go("menu")};
A.cats=()=>{const d=dlg(`<h3>Categories</h3><div class="list">${D.cats.map(c=>`<div class="bar" style="margin:0"><input value="${esc(c.name)}" maxlength="40" data-cid="${c.id}" aria-label="Category name" style="flex:1"><button class="btn del sm" data-cd="${c.id}">Delete</button></div>`).join("")}</div><label>Add category<input id="nc" maxlength="40" placeholder="e.g. Drinks"></label><div class="bar" style="margin-top:10px"><button class="btn alt" id="cx">Close</button><button class="btn" id="addc">Add</button></div>`);
 d.querySelectorAll("[data-cid]").forEach(el=>el.onchange=()=>run(async()=>{const v=el.value.trim();if(!v)return;await q(sb.from("categories").update({name:v}).eq("id",el.dataset.cid));toast("Renamed")}));
 d.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>run(async()=>{if(!confirm("Delete this category? It must have no items."))return;try{await q(sb.from("categories").delete().eq("id",b.dataset.cd))}catch(e){throw new Error("Category still has items — move or delete them first.")}d.close();go("menu")}));
 $("#addc").onclick=()=>run(async()=>{const v=$("#nc").value.trim();if(!v)return;await q(sb.from("categories").insert({name:v,sort:Math.max(0,...D.cats.map(c=>c.sort))+1}));d.close();go("menu")})};
// ---------- offers ----------
V.offers=async()=>{D.offers=await q(sb.from("offers").select("*").order("created_at",{ascending:false}));D.set=(await q(sb.from("site_settings").select("*").eq("id",1)))[0]||{};
 $("#view").innerHTML=`<div class="bar"><h2>Offers &amp; Promotions</h2><button class="btn" data-a="newOffer">+ New offer</button></div><div class="list">${D.offers.map(o=>`<div class="row">${o.image_url?`<img src="${esc(o.image_url)}" alt="">`:`<div class="ph">🏷</div>`}<div><b>${esc(o.title)}</b> ${badge(live(o),"Live now","Not live")} ${D.set.popup_offer_id===o.id?'<span class="badge on">Popup</span>':""}<div class="note">${esc([dtext(o),o.promo_code?"Code "+o.promo_code:"",o.start_at?"From "+fd(o.start_at):"",o.end_at?"Until "+fd(o.end_at):""].filter(Boolean).join(" · ")||"No discount / no schedule")}</div><div class="note">${o.published?"Published":"Unpublished"} · ${o.active?"Active":"Inactive"}</div></div><div class="ac"><button class="btn alt sm" data-a="editOffer" data-id="${o.id}">Edit</button><button class="btn alt sm" data-a="prevOffer" data-id="${o.id}">Preview</button><button class="btn alt sm" data-a="pubOffer" data-id="${o.id}">${o.published?"Unpublish":"Publish"}</button><button class="btn alt sm" data-a="popOffer" data-id="${o.id}">Use in popup</button><button class="btn del sm" data-a="delOffer" data-id="${o.id}">Delete</button></div></div>`).join("")||"<p>No offers yet.</p>"}</div>`};
A.newOffer=()=>offerForm({});A.editOffer=id=>offerForm(D.offers.find(o=>o.id===id));
A.prevOffer=id=>{const o=D.offers.find(x=>x.id===id);const d=dlg(`<h3>Preview</h3>${pv(o,o.image_url)}<p class="note">${live(o)?"This offer is live right now.":"This offer is not live (unpublished, inactive or outside its dates)."}</p><div class="bar"><button class="btn alt" id="cx">Close</button></div>`)};
A.pubOffer=async id=>{const o=D.offers.find(x=>x.id===id);await q(sb.from("offers").update({published:!o.published}).eq("id",id));toast(o.published?"Unpublished":"Published");go("offers")};
A.popOffer=async id=>{await q(sb.from("site_settings").upsert({id:1,popup_offer_id:id,popup_enabled:true,updated_at:new Date().toISOString()}));toast("Popup offer set");go("offers")};
A.delOffer=async id=>{const o=D.offers.find(x=>x.id===id);if(!confirm(`Delete offer "${o.title}"?`))return;await rm(o.image_url);await q(sb.from("offers").delete().eq("id",id));toast("Offer deleted");go("offers")};
function offerForm(o){const im=imgField(o.image_url),v=(k,d="")=>esc(o[k]??d);
 const d=dlg(`<form id="f"><h3>${o.id?"Edit":"New"} offer</h3><label>Title<input name="title" required maxlength="80" value="${v("title")}"></label><label>Short description<textarea name="description" maxlength="300" rows="2">${v("description")}</textarea></label>${im.html}
 <label>Discount type<select name="discount_type">${[["none","No discount (announcement only)"],["percentage","Percentage"],["fixed","Fixed amount (৳)"]].map(([a,b])=>`<option value="${a}"${(o.discount_type||"none")===a?" selected":""}>${b}</option>`).join("")}</select></label>
 <label>Discount value (% or ৳)<input name="discount_value" inputmode="numeric" value="${v("discount_value")}"></label>
 <label>Applies to — item or category names, comma separated (blank = whole order)<input name="applies_to" value="${v("applies_to")}"></label>
 <label>Promo code (optional)<input name="promo_code" maxlength="30" value="${v("promo_code")}"></label>
 <label>Button text<input name="cta_text" maxlength="30" value="${v("cta_text","Order Now")}"></label><label>Button destination (#section, /path or https:// link)<input name="cta_link" value="${v("cta_link","#menu")}"></label>
 <label>Starts (Bangladesh time)<input type="datetime-local" name="start_at" value="${toLocal(o.start_at)}"></label><label>Ends (Bangladesh time)<input type="datetime-local" name="end_at" value="${toLocal(o.end_at)}"></label>
 <label class="chk"><input type="checkbox" name="active"${o.id?(o.active?" checked":""):" checked"}> Active</label><label class="chk"><input type="checkbox" name="published"${o.published?" checked":""}> Published</label>
 <div id="pvbox"></div><p class="err" id="ferr" role="alert"></p><div class="bar"><button class="btn alt" type="button" id="cx">Cancel</button><button class="btn alt" type="button" id="pvb">Preview</button><button class="btn">Save</button></div></form>`);im.bind();
 const read=f=>({title:String(f.get("title")).trim(),description:String(f.get("description")||"").trim()||null,discount_type:f.get("discount_type"),discount_value:f.get("discount_value")?Number(f.get("discount_value")):null,applies_to:String(f.get("applies_to")||"").trim()||null,promo_code:String(f.get("promo_code")||"").trim().toUpperCase()||null,cta_text:String(f.get("cta_text")||"Order Now").trim(),cta_link:String(f.get("cta_link")||"#menu").trim(),start_at:fromLocal(f.get("start_at")),end_at:fromLocal(f.get("end_at")),active:!!f.get("active"),published:!!f.get("published")});
 $("#pvb").onclick=()=>{$("#pvbox").innerHTML=pv(read(new FormData($("#f"))),im.preview())};
 d.querySelector("#f").onsubmit=ev=>{ev.preventDefault();run(async()=>{const r=read(new FormData(ev.target));const err=m=>$("#ferr").textContent=m;
  if(!r.title)return err("Title is required.");if(r.discount_type!=="none"&&!(Number.isInteger(r.discount_value)&&r.discount_value>0&&(r.discount_type!=="percentage"||r.discount_value<=100)))return err("Enter a valid discount value (percentage 1–100, or whole ৳ amount).");
  if(r.start_at&&r.end_at&&r.end_at<=r.start_at)return err("End must be after start.");if(!/^(#|\/|https:\/\/)/.test(r.cta_link))return err("Destination must start with #, / or https://");
  r.image_url=await im.save("offers");o.id?await q(sb.from("offers").update(r).eq("id",o.id)):await q(sb.from("offers").insert(r));d.close();toast("Offer saved");go("offers")})}}
// ---------- combos ----------
V.combos=async()=>{D.combos=await q(sb.from("combos").select("*").order("sort"));
 $("#view").innerHTML=`<div class="bar"><h2>Combos</h2><button class="btn" data-a="newCombo">+ New combo</button></div><div class="list">${D.combos.map(c=>`<div class="row">${c.image_url?`<img src="${esc(c.image_url)}" alt="">`:`<div class="ph">🍱</div>`}<div><b>${esc(c.title)}</b> ${badge(c.active,"Active","Inactive")}<div class="note">${esc(c.items.join(" + "))}</div><div class="note"><s>৳${c.original_price}</s> → <b>৳${c.price}</b></div></div><div class="ac"><button class="btn alt sm" data-a="editCombo" data-id="${c.id}">Edit</button><button class="btn del sm" data-a="delCombo" data-id="${c.id}">Delete</button></div></div>`).join("")}</div>`};
A.newCombo=()=>comboForm({});A.editCombo=id=>comboForm(D.combos.find(c=>c.id===id));
A.delCombo=async id=>{const c=D.combos.find(x=>x.id===id);if(!confirm(`Delete "${c.title}"?`))return;await rm(c.image_url);await q(sb.from("combos").delete().eq("id",id));go("combos")};
function comboForm(c){const im=imgField(c.image_url);const d=dlg(`<form id="f"><h3>${c.id?"Edit":"New"} combo</h3><label>Title<input name="title" required maxlength="80" value="${esc(c.title||"")}"></label><label>Items (comma separated)<input name="items" required value="${esc((c.items||[]).join(", "))}"></label><label>Original total ৳<input name="o" required inputmode="numeric" value="${c.original_price||""}"></label><label>Combo price ৳<input name="p" required inputmode="numeric" value="${c.price||""}"></label><label class="chk"><input type="checkbox" name="active"${c.id?(c.active?" checked":""):" checked"}> Active</label><p class="note">Optional photo — if empty, the website shows photos of the items.</p>${im.html}<p class="err" id="ferr" role="alert"></p><div class="bar"><button class="btn alt" type="button" id="cx">Cancel</button><button class="btn">Save</button></div></form>`);im.bind();
 d.querySelector("#f").onsubmit=ev=>{ev.preventDefault();run(async()=>{const f=new FormData(ev.target),items=String(f.get("items")).split(",").map(x=>x.trim()).filter(Boolean),o=Number(f.get("o")),p=Number(f.get("p"));
  if(!f.get("title").trim()||items.length<2)return $("#ferr").textContent="Enter a title and at least two items.";if(!Number.isInteger(o)||!Number.isInteger(p)||p<1||o<=p)return $("#ferr").textContent="Prices must be whole numbers and the combo price must be lower than the original total.";
  const row={title:String(f.get("title")).trim(),items,original_price:o,price:p,active:!!f.get("active"),image_url:await im.save("combos")};if(c.id)await q(sb.from("combos").update(row).eq("id",c.id));else await q(sb.from("combos").insert({...row,sort:99}));d.close();toast("Combo saved");go("combos")})}}
// ---------- popup manager ----------
V.popup=async()=>{D.offers=await q(sb.from("offers").select("*").order("created_at",{ascending:false}));const s=(await q(sb.from("site_settings").select("*").eq("id",1)))[0]||{};
 const draw=()=>{const o=D.offers.find(x=>x.id===$("#po").value);$("#pvp").innerHTML=o?pv(o,o.image_url)+`<p class="note">${live(o)?"This offer will appear immediately when visitors open the website (if the popup is enabled).":"This offer is not live right now (unpublished, inactive or outside its dates), so no popup will show."}</p>`:"<p class='note'>No offer selected — no popup will show.</p>"};
 $("#view").innerHTML=`<h2>Popup Manager</h2><div class="panel" style="width:100%;max-width:560px"><label class="chk"><input type="checkbox" id="pe"${s.popup_enabled?" checked":""}> Show popup to visitors</label><label>Offer to show<select id="po"><option value="">— none —</option>${D.offers.map(o=>`<option value="${o.id}"${s.popup_offer_id===o.id?" selected":""}>${esc(o.title)}</option>`).join("")}</select></label><p class="note">The popup appears right away on every fresh page load and stays closed after the visitor dismisses it until they reload.</p><button class="btn" id="ps">Save popup settings</button><h3 style="margin-top:16px">Preview</h3><div id="pvp"></div></div>`;
 draw();$("#po").onchange=draw;$("#ps").onclick=()=>run(async()=>{await q(sb.from("site_settings").upsert({id:1,popup_enabled:$("#pe").checked,popup_offer_id:$("#po").value||null,updated_at:new Date().toISOString()}));toast("Popup settings saved")})};
// ---------- image library ----------
V.library=async()=>{let h="";for(const f of["items","offers","combos"]){const l=await q(sb.storage.from("media").list(f,{limit:200}));h+=`<h3>${f}</h3><div class="grid2">${l.filter(x=>x.name&&x.id).map(x=>{const u=sb.storage.from("media").getPublicUrl(f+"/"+x.name).data.publicUrl;return `<div><img src="${esc(u)}" alt="" loading="lazy"><button class="btn alt sm" data-a="copy" data-id="${esc(u)}">Copy URL</button> <button class="btn del sm" data-a="delImg" data-id="${esc(f+"/"+x.name)}">Delete</button></div>`}).join("")||"<p class='note'>Empty</p>"}</div>`}
 $("#view").innerHTML=`<h2>Image Library</h2><p class="note">Photos uploaded through the admin screens. Upload or replace pictures from Menu, Offers or Combos.</p>${h}`};
A.copy=async u=>{await navigator.clipboard.writeText(u);toast("URL copied")};
A.delImg=async p=>{if(!confirm("Delete this image file? Items using it will show no picture."))return;await q(sb.storage.from("media").remove([p]));toast("Image deleted");go("library")};
// ---------- settings ----------
V.settings=async()=>{const s=(await q(sb.from("site_settings").select("*").eq("id",1)))[0]||{};
 $("#view").innerHTML=`<h2>Website Settings</h2><div class="panel" style="width:100%;max-width:560px"><h3>Delivery charge</h3><label class="chk"><input type="checkbox" id="de"${s.delivery_enabled?" checked":""}> Charge a fixed delivery fee</label><label>Delivery charge ৳<input id="dc" inputmode="numeric" value="${s.delivery_charge??""}"></label><p class="note">If this is off, delivery orders say "delivery charge confirmed by restaurant".</p><button class="btn" id="ss">Save</button></div><div class="panel" style="width:100%;max-width:560px;margin-top:16px"><h3>Change password</h3><label for="np2">New password (10+ characters)</label><input id="np2" type="password" autocomplete="new-password"><button class="btn" id="pw2" style="margin-top:10px">Update password</button></div>`;
 $("#ss").onclick=()=>run(async()=>{const c=$("#dc").value.trim()===""?null:Number($("#dc").value);if(c!==null&&(!Number.isInteger(c)||c<0))throw new Error("Delivery charge must be a whole number.");if($("#de").checked&&c===null)throw new Error("Enter the delivery charge.");await q(sb.from("site_settings").upsert({id:1,delivery_enabled:$("#de").checked,delivery_charge:c,updated_at:new Date().toISOString()}));toast("Settings saved")});
 $("#pw2").onclick=()=>run(async()=>{const p=$("#np2").value;if(p.length<10)throw new Error("Use at least 10 characters.");const{error}=await sb.auth.updateUser({password:p});if(error)throw error;$("#np2").value="";toast("Password updated")})};
</script></body></html>
